<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shinobi Duel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button id="btn-mute" title="Silenciar">🔊</button>
  <main id="game">
    <section id="screen-title" class="screen active">
      <h1>忍 Shinobi Duel</h1>
      <p>Torneo de combate por turnos. Derrota a cinco rivales seguidos.</p>
      <button id="btn-start" class="primary">Empezar</button>
    </section>
    <section id="screen-roster" class="screen">
      <h2>Elige tu shinobi</h2>
      <div id="roster"></div>
    </section>
    <section id="screen-bracket" class="screen">
      <h2>Camino al trofeo</h2>
      <div id="bracket"></div>
      <p id="bracket-info"></p>
      <button id="btn-fight" class="primary">¡Al combate!</button>
    </section>
    <section id="screen-dialogue" class="screen">
      <div class="dialogue-box">
        <h3 class="dialogue-name"></h3>
        <p class="dialogue-text"></p>
        <small>Clic o Enter para continuar</small>
      </div>
    </section>
    <section id="screen-battle" class="screen">
      <h2 id="fight-label"></h2>
      <div class="arena" id="arena">
        <div class="info" id="enemy-info">
          <h3 id="enemy-name"></h3>
          <div class="bar hp"><i id="enemy-hp"></i></div><small id="enemy-hp-text"></small>
          <div class="bar chakra"><i id="enemy-chakra"></i></div><small id="enemy-chakra-text"></small>
          <div class="status" id="enemy-status"></div>
        </div>
        <div class="sprite" id="enemy-panel"><div class="portrait" id="enemy-portrait"></div></div>
        <div class="sprite" id="player-panel"><div class="portrait" id="player-portrait"></div></div>
        <div class="info" id="player-info">
          <h3 id="player-name"></h3>
          <div class="bar hp"><i id="player-hp"></i></div><small id="player-hp-text"></small>
          <div class="bar chakra"><i id="player-chakra"></i></div><small id="player-chakra-text"></small>
          <div class="status" id="player-status"></div>
        </div>
        <div class="banner" id="banner"></div>
      </div>
      <div class="bottom">
        <div id="log"></div>
        <div id="skills"></div>
      </div>
    </section>
    <section id="screen-result" class="screen">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <button id="btn-again" class="primary">Jugar de nuevo</button>
    </section>
  </main>
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
